name: Verify ledger on Ubuntu
on:
  push:
    branches: [verify/stage-5]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@10.15.1
      - run: pnpm install --no-frozen-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-lockfile
          path: pnpm-lock.yaml
      - name: Capture resolved dependency graph
        run: |
          gzip -nc pnpm-lock.yaml | base64 -w 160 | sed 's/^/LEDGER_LOCK_CHUNK /'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:setup && pnpm db:migrate && pnpm db:seed
      - run: pnpm typecheck:api && pnpm build:web
      - run: pnpm test
      - name: Smoke test development servers and seed
        run: |
          pnpm db:setup && pnpm db:migrate && pnpm db:seed
          pnpm dev > "$RUNNER_TEMP/ledger-dev.log" 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" || true' EXIT
          curl -fsS --retry 45 --retry-delay 1 --retry-all-errors http://localhost:4200/api/invoices -o /tmp/ledger-invoices.json
          node -e "if(require('/tmp/ledger-invoices.json').length !== 4) process.exit(1)"
          curl -fsS http://localhost:4200/invoices/1 | grep -q 'ledger-root'
