name: Runtime compatibility
on: [push]
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22.21.0', '22.22.3']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2ed98d3c2f78ff14f7f88a97f23d38fda6db8a36
          persist-credentials: false
      - run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@10.15.1
      - name: Check database setup as root and a new user
        run: |
          set +e
          sudo bash scripts/setup-db.sh > /tmp/root-result 2>&1
          rc=$?
          set -e
          cat /tmp/root-result
          test "$rc" = 1
          grep -F 'regular Ubuntu user' /tmp/root-result
          sudo useradd -m -s /bin/bash ledgercheck
          echo 'ledgercheck ALL=(ALL) NOPASSWD: ALL' | sudo tee /etc/sudoers.d/ledgercheck >/dev/null
          install -m 755 scripts/setup-db.sh /tmp/ledger-setup
          cd /tmp
          for pass in 1 2; do
            sudo -Hu ledgercheck env LEDGER_DB=ledger_dev LEDGER_TEST_DB=ledger_test bash ./ledger-setup
          done
          for db in ledger_dev ledger_test; do
            sudo -Hu ledgercheck psql -At -d "$db" -c 'select current_user, current_database(), version()'
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:setup && pnpm db:migrate && pnpm db:seed
      - run: pnpm typecheck:api && pnpm test:api
      - run: pnpm build:web
      - if: ${{ !cancelled() }}
        run: pnpm test:web
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$RESULT" -f context="Node ${{ matrix.node }}" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
